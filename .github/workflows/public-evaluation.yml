name: Public evaluation hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate public artifacts
        run: python3 scripts/validate_public_evaluation.py
      - name: Scan for accidental sensitive material
        run: |
          ! grep -RInE 'OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY|AWS_SECRET_ACCESS_KEY|BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY|Bearer[[:space:]]+[A-Za-z0-9._-]{12,}|C:\\\\Users\\\\check|/home/ubuntu/|/tmp/|\.env([.]|$)' . --exclude-dir=.git --exclude='.github/workflows/public-evaluation.yml'
