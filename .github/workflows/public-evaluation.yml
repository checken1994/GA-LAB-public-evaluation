name: Public evaluation hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate public artifacts
        run: |
          python3 -m json.tool PUBLIC_EXPORT_MANIFEST.json >/dev/null
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with Path('REVIEW_SHEET_50.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 50, len(rows)
          for p in Path('artifacts').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8-sig'))
          print('public-evaluation checks: PASS')
          PY
      - name: Scan for accidental sensitive material
        run: |
          ! grep -RInE 'OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY|AWS_SECRET_ACCESS_KEY|BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY|Bearer[[:space:]]+[A-Za-z0-9._-]{12,}|C:\\\\Users\\\\check|/home/ubuntu/|/tmp/|\.env([.]|$)' . --exclude-dir=.git --exclude='.github/workflows/public-evaluation.yml'
